<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>프로게이머 커리어</title>
<meta name="theme-color" content="#0E1A2B">
<meta name="description" content="15세 2군 벤치에서 시작하는 롤 프로게이머 커리어 시뮬레이터">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="롤 커리어">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#0E1A2B; --panel:#15253B; --panel2:#1B304D; --line:#284262; --text:#E7EEF6; --mute:#8DA2BC;
  --gold:#D6B25E; --gold2:#F0D48A; --blue:#3E7CF2; --red:#E2484F; --good:#53C08D; --bad:#E58466;
  --disp:'Pretendard Variable',Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif; --body:'Pretendard Variable',Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font:15px/1.6 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num,.num-line,td,.tot{font-variant-numeric:tabular-nums}
b{font-weight:700}
.gold{color:var(--gold2)}
.hint{color:var(--mute);font-size:13px;margin:6px 0}
small{color:var(--mute)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 16px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--mute)}
.btn.gold{background:var(--gold);color:#1B1405;border-color:var(--gold);font-weight:700}
.btn.gold:hover{background:var(--gold2)}
.btn.gold small{color:#4a3a12}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{padding:14px 28px;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* 타이틀 */
.title{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:
  radial-gradient(ellipse 60% 50% at 50% 0%,rgba(214,178,94,.13),transparent 70%),var(--ink)}
.tcard{max-width:560px}
.tdate{display:inline-block;background:var(--gold);color:#1B1405;font:22px var(--disp);padding:4px 14px;border-radius:4px;letter-spacing:.04em}
.title h1{font:clamp(56px,11vw,104px)/0.95 var(--disp);margin:22px 0 18px;letter-spacing:-.01em}
.tsub{color:var(--mute);font-size:16px;max-width:42ch}
.tbtn{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}

/* 선수 생성 */
.create{max-width:1180px;margin:0 auto;padding:16px}
.ch{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.ch h2{font:30px var(--disp);margin:0}
.cdate{margin-left:auto;color:var(--gold2);font:18px var(--disp)}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel h3{font:20px var(--disp);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.panel h3:not(:first-child){margin-top:22px}
.fld{display:block;margin:10px 0;color:var(--mute);font-size:13px}
.fld input{display:block;width:100%;margin-top:4px;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;color:var(--text);font:16px var(--body)}
.seg{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 4px;font-weight:700}
.seg button.on{background:var(--gold);color:#1B1405;border-color:var(--gold)}
.tot{margin-left:auto;font:16px var(--body);color:var(--gold2)}
.tot.bad{color:var(--bad)}
.sl{display:grid;grid-template-columns:84px 1fr 70px;gap:10px;align-items:center;margin:8px 0}
.sl span{color:var(--mute);font-size:14px}
.sl input[type=range]{accent-color:var(--gold);width:100%}
.sl input[type=number]{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px;color:var(--text);width:100%;font:15px var(--body)}
.lgh{font:16px var(--disp);color:var(--gold2);margin:18px 0 8px;font-weight:400}
.lgh:first-of-type{margin-top:4px}
.tms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tm{text-align:left;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tm span{font-size:12px;color:var(--mute)}
.tm.on{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.cf{position:sticky;bottom:0;display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:14px 0;background:linear-gradient(transparent,var(--ink) 30%)}
.err{color:var(--bad)}

/* 게임 */
.game{display:grid;grid-template-columns:290px minmax(0,1fr) 340px;grid-template-rows:auto 1fr;gap:14px;padding:0 14px 24px;max-width:1500px;margin:0 auto}
.bug{grid-column:1/-1;display:flex;align-items:stretch;gap:0;margin-top:12px;position:sticky;top:0;z-index:5;background:var(--ink);padding:6px 0}
.bug .d{background:var(--gold);color:#1B1405;font:24px var(--disp);padding:8px 16px;border-radius:6px 0 0 6px;letter-spacing:.03em;white-space:nowrap}
.bug .ph{background:var(--panel2);padding:10px 16px;border-radius:0 6px 6px 0;flex:1;font-weight:500;display:flex;align-items:center}
.bug .sv{display:flex;gap:6px;align-items:center;margin-left:10px}
.card,.side{align-self:start;position:sticky;top:72px;max-height:calc(100vh - 84px);overflow:auto}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pc-top{display:flex;gap:12px;align-items:center;padding:14px;border-top:4px solid var(--tc);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 18%,transparent),transparent)}
.pc-top .pos{font:13px var(--disp);background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.pc-top h2{font:26px/1 var(--disp);margin:0}
.pc-top p{margin:2px 0 0;color:var(--mute);font-size:13px}
.pc-top .ovr{margin-left:auto;text-align:center;line-height:1}
.pc-top .ovr b{font:34px var(--disp);color:var(--gold2)}
.pc-top .ovr span{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.pc-team{padding:0 14px 10px;font-weight:500}
.tag{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-left:6px;color:var(--gold2)}
.stats{padding:4px 14px 10px}
.srow{display:grid;grid-template-columns:76px 1fr 36px 28px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.srow span{color:var(--mute)}
.sbar{height:7px;background:var(--ink);border-radius:4px;display:flex;overflow:hidden}
.sbar i{display:block;background:var(--blue)}
.sbar i.bn{background:var(--gold)}
.srow b{text-align:right}
.srow small{color:var(--gold2)}
.meta{display:grid;grid-template-columns:62px 1fr;gap:4px 10px;padding:10px 14px;margin:0;border-top:1px solid var(--line);font-size:13px}
.meta dt{color:var(--mute)}
.meta dd{margin:0}
.cbar{display:inline-flex;gap:2px;vertical-align:middle}
.cbar i{width:7px;height:10px;background:var(--ink);border-radius:1px}
.cbar i.on{background:var(--good)}
.traits{padding:10px 14px 14px;border-top:1px solid var(--line)}
.traits h5{margin:0 0 6px;font:14px var(--disp);font-weight:400;color:var(--mute)}
.trait{display:inline-block;font-size:12px;border:1px solid var(--gold);color:var(--gold2);border-radius:4px;padding:2px 7px;margin:0 4px 4px 0}

.stage{min-width:0}
.fx{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.fx span{width:100%;color:var(--mute);font-size:13px}
.fx b{font:24px var(--disp);font-weight:400}
.fx i{color:var(--mute);font-style:normal}
.fx em{margin-left:auto;font-style:normal;font-size:13px;border:1px solid var(--gold);color:var(--gold2);padding:2px 8px;border-radius:4px}
.fx.none{color:var(--mute)}
.sec,.phase{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.sec h3,.phase h3{font:19px var(--disp);font-weight:400;margin:0 0 10px}
.phase h3{color:var(--gold2)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.act{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:4px}
.act:hover{border-color:var(--gold)}
.act b{font:18px var(--disp);font-weight:400}
.act span{font-size:12px;color:var(--mute)}
.log,.note{background:var(--panel2);border-left:3px solid var(--blue);border-radius:6px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.note{border-left-color:var(--gold)}
.num-line{font-size:13px;color:var(--text);opacity:.9}
.report{background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.report h4{margin:0 0 6px;font:17px var(--disp);font-weight:400}
.report h4 span{font:13px var(--body);color:var(--mute);margin-left:6px}
.report p{margin:4px 0}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:10px;padding:10px;background:color-mix(in srgb,var(--ink) 88%,transparent);border-radius:10px;border:1px solid var(--line)}
.ctrl .btn.gold{flex:1}

/* 경기 박스 */
.box{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;margin:6px 0}
.bt{font:16px var(--disp);display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.bt span{font:12px var(--body);color:var(--mute)}
.pv-team{border-left:4px solid var(--tc);padding-left:10px;margin:10px 0;overflow-x:auto}
.pv-team h4{margin:0;font:18px var(--disp);font-weight:400}
.staff{font-size:12px;color:var(--mute)}
table{border-collapse:collapse;width:100%}
.st{font-size:12px;min-width:560px;margin-top:6px}
.st th,.st td{padding:4px 5px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.st thead th{color:var(--mute);font-weight:500;font-size:11px;line-height:1.2;vertical-align:bottom}
.st th:first-child,.st .nm{text-align:left}
.st td small{margin-left:2px}
.st td.up small{color:var(--good)}
.st td.dn small{color:var(--bad)}
.st td.ov{color:var(--gold2);font-weight:700}
.st tr.me td,.st tr.me th{background:color-mix(in srgb,var(--gold) 12%,transparent)}
.cd{font-style:normal;font-size:10px;margin-left:5px;padding:0 4px;border-radius:3px}
.cd.up{background:color-mix(in srgb,var(--good) 30%,transparent)}
.cd.dn{background:color-mix(in srgb,var(--bad) 30%,transparent)}
.fan{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.lane{padding:8px 0;border-bottom:1px solid var(--line)}
.lane:last-child{border-bottom:0}
.lane.me .lt{color:var(--gold2)}
.lt .num{font-weight:700;margin:0 4px}
.rbar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:6px 0}
.rbar i{display:block}
.calc{font-size:12.5px;color:var(--mute);background:color-mix(in srgb,var(--panel2) 60%,transparent);border-radius:6px;padding:8px 10px;margin-top:8px;line-height:1.7}
.calc b{color:var(--text)}
.calc.sm{font-size:12px;padding:6px 8px}
.calc>div+div{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.story p{margin:8px 0}
.story p.me,p.me{border-left:3px solid var(--gold);padding-left:10px}
.final{margin-top:10px;font-weight:700}
.draft{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.draft>div{border-top:3px solid var(--tc);padding-top:6px}
.draft h4{margin:0;font:16px var(--disp);font-weight:400}
.bans{font-size:12px;color:var(--mute);margin:4px 0}
.draft ul{list-style:none;margin:0;padding:0}
.draft li{display:grid;grid-template-columns:56px 1fr auto auto;gap:6px;padding:3px 0;font-size:13px;align-items:center}
.draft li span{color:var(--mute);font-size:11px}
.draft li em{font-style:normal;font-size:10px;color:var(--gold2);border:1px solid var(--gold);border-radius:3px;padding:0 3px}
.draft li.me{color:var(--gold2)}
.score{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 12px}
.score b{font:22px var(--disp);font-weight:400}
.score .num{font:34px var(--disp);color:var(--gold2)}
.score.big .num{font-size:44px}
.sb{font-size:12px}
.sb th,.sb td{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left}
.sb th{color:var(--mute);font-weight:500}
.sb tr.me td{color:var(--gold2)}
.dl{display:grid;grid-template-columns:110px 1fr;gap:10px;margin:6px 0;align-items:start}
.dl .who{font-size:12px;color:var(--gold2);padding-top:2px}
.dl p{margin:0}
.dl.me .who{color:var(--gold)}
.crew{font-size:12px;color:var(--mute);margin-bottom:6px}
.meet{border-left:3px solid var(--tc,var(--line));padding-left:10px;margin:8px 0}
.meet .mh{font:15px var(--disp);color:var(--tc)}
.sum{margin-top:12px;padding-top:12px;border-top:1px solid var(--gold)}
.pom{}
.pomh{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.pomh b{font:28px var(--disp);font-weight:400;color:var(--gold2)}
.pomh span{color:var(--mute);font-size:13px}
.pom textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:6px;color:var(--text);font:15px var(--body);padding:10px;margin:2px 0 12px}
.art{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:12px}
.art h5{margin:0 0 4px;font-size:15px}
.art p{margin:0;font-size:14px;color:var(--mute)}
.comm{margin-top:8px}
.cp{font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.cp .h{color:var(--mute);font-size:12px;margin-right:8px}
.event{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--good);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.event.bad{border-left-color:var(--bad)}
.event h4{margin:0 0 4px;font:17px var(--disp);font-weight:400}
.event p{margin:0 0 6px}
.dg h5{margin:10px 0 4px;color:var(--mute);font-weight:500;font-size:13px}
.dr{display:grid;grid-template-columns:1fr 44px 1fr auto;gap:8px;font-size:13px;padding:3px 0;align-items:center}
.dr span{color:var(--mute)} .dr span.w{color:var(--text);font-weight:700}
.dr b{text-align:center} .dr small{font-size:11px}
.dr.me{background:color-mix(in srgb,var(--gold) 10%,transparent);border-radius:4px}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.offer{text-align:left;background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--tc,var(--line));border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px}
.offer b{font:18px var(--disp);font-weight:400}
.offer span{font-size:13px;color:var(--mute)}
.offer.ghost{background:transparent}

/* 사이드 */
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px 10px 0 0;padding:4px}
.tabs button{flex:1;background:transparent;border:0;border-radius:6px;padding:7px 2px;font-size:13px;color:var(--mute)}
.tabs button.on{background:var(--panel2);color:var(--text);font-weight:700}
.tabc{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:12px;font-size:13px}
.tabc select{width:100%;background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px;font:14px var(--body)}
.nw{border-bottom:1px solid var(--line);padding:9px 0}
.nw .nh{display:flex;gap:8px;font-size:11px;color:var(--mute)}
.nw .nh span{color:var(--gold2)}
.nw.community .nh span{color:#9FB7FF} .nw.sns .nh span{color:#F09BC0} .nw.patch .nh span{color:var(--good)} .nw.event .nh span{color:var(--bad)}
.nw h5{margin:2px 0;font-size:14px}
.nw p{margin:0;color:var(--mute)}
.nw.me h5{color:var(--gold2)}
.tbl{font-size:12.5px;margin-top:6px}
.tbl th,.tbl td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--mute);font-weight:500}
.tbl tr.me td{color:var(--gold2);font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.star{font-style:normal;color:var(--gold);font-size:9px;margin-left:3px;vertical-align:middle}
.coach{font-size:12px;margin:2px 0}

.modal{position:fixed;inset:0;background:rgba(5,10,18,.78);display:grid;place-items:center;z-index:20;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--gold);border-radius:12px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.mbox h2{font:30px var(--disp);font-weight:400;margin:0;color:var(--gold2)}
.mdate{color:var(--mute);margin:2px 0 14px}
.msplit{display:grid;grid-template-columns:300px 1fr;gap:16px;margin-bottom:16px}
.msplit h4{margin:0 0 6px;font:16px var(--disp);font-weight:400}
.mn{border-bottom:1px solid var(--line);padding:6px 0;font-size:13px}
.mn p{margin:2px 0 0;color:var(--mute)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:10px 16px;border-radius:8px;z-index:30;max-width:90vw}

@media (max-width:1180px){
  .game{grid-template-columns:270px minmax(0,1fr)}
  .side{grid-column:1/-1;position:static;max-height:none}
}
@media (max-width:760px){
  .game{grid-template-columns:minmax(0,1fr);padding:0 12px 20px}
  .card{position:static;max-height:none}
  .bug{flex-wrap:wrap;gap:6px}
  .bug .d{border-radius:6px;font-size:20px}
  .bug .ph{border-radius:6px;font-size:13px}
  .bug .sv{margin-left:0}
  .cgrid,.msplit{grid-template-columns:1fr}
  .acts{grid-template-columns:1fr}
  .draft{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:0}
}
/* ---- v2 ---- */
h1,h2,h3,h4,.bt,.act b,.fx b,.score b,.offer b,.pc-top h2,.pomh b,.lgh,.tdate,.bug .d{font-weight:800!important;letter-spacing:-.01em}
.title h1{font-weight:900!important;letter-spacing:-.03em}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.seg.two{grid-template-columns:1fr 1fr;margin-bottom:12px}
.seg button{min-width:0}
.panel h3 .btn{margin-left:8px;font-weight:600}
.panel h3{white-space:nowrap;flex-wrap:nowrap}
.tot,.btn,.ch h2{white-space:nowrap}
.sl{grid-template-columns:76px minmax(60px,1fr) 64px auto}
.stp{display:flex;gap:3px}
.stp button{background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font-size:12px}
.stp button:hover{border-color:var(--gold)}
input[type=color]{height:40px;padding:2px}
.bug .ph{gap:10px}.bug .ph small{margin-left:auto;color:var(--gold2);font-weight:600}
.bug select,.srch{background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:13px var(--body)}
.srch{width:100%;margin-bottom:8px;padding:8px}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px}
.score b{min-width:0;overflow-wrap:anywhere;line-height:1.25}
.score b:first-child{text-align:right}
.score .num{white-space:nowrap;text-align:center}
.fx{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;align-items:center}
.fx span{grid-column:1/-1}
.fx b{font-size:20px;overflow-wrap:anywhere;line-height:1.25}
